# 릴리스 — v 로 시작하는 태그를 밀면 모드 · 런처 · update.json 을 만들어 릴리스에 올립니다.
#
#   git tag v0.1.6 && git push origin v0.1.6
#
# 런처는 늘 최신 릴리스의 update.json 을 봅니다:
#   https://github.com/<owner>/<repo>/releases/latest/download/update.json

name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: read versions
        id: vars
        run: |
          MOD=$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          API=$(grep -E '^fabric_api_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          MC=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          LOADER=$(grep -E '^loader_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v*) ;;
            *) TAG="v${MOD}" ;;   # 손으로 돌렸을 때
          esac
          echo "mod=$MOD"       >> "$GITHUB_OUTPUT"
          echo "api=$API"       >> "$GITHUB_OUTPUT"
          echo "mc=$MC"         >> "$GITHUB_OUTPUT"
          echo "loader=$LOADER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          # 태그와 gradle.properties 의 버전이 다르면 런처가 영영 "새 버전 있음" 으로 보입니다
          if [ "$TAG" != "v${MOD}" ]; then
            echo "::error::태그 $TAG 와 gradle.properties 의 version=$MOD 가 다릅니다"
            exit 1
          fi

      - name: build mod and launcher
        # 클라이언트 게임테스트는 화면이 필요해 CI 에서는 건너뜁니다 (서버 게임테스트는 그대로 돕니다)
        run: ./gradlew build :launcher:jar -x runClientGameTest -Prepo=${{ github.repository }}

      - name: fetch fabric api
        id: api
        run: |
          API='${{ steps.vars.outputs.api }}'
          ENC=$(printf '%s' "$API" | sed 's/+/%2B/g')
          URL="https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${ENC}/fabric-api-${ENC}.jar"
          mkdir -p release
          curl -fsSL -o "release/fabric-api-${API}.jar" "$URL"
          SHA=$(sha256sum "release/fabric-api-${API}.jar" | cut -d' ' -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Fabric API ${API} — ${SHA}"

      - name: write update.json
        run: |
          ./gradlew updateManifest \
            -PreleaseTag=${{ steps.vars.outputs.tag }} \
            -Prepo=${{ github.repository }} \
            -PfabricApiSha=${{ steps.api.outputs.sha }}
          cat build/update.json

      - name: collect assets
        run: |
          cp build/update.json release/
          cp build/libs/overbreak-${{ steps.vars.outputs.mod }}.jar release/
          cp launcher/build/libs/overbreak-launcher-${{ steps.vars.outputs.mod }}.jar release/
          ls -l release

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: OVERBREAK ${{ steps.vars.outputs.mod }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release/overbreak-${{ steps.vars.outputs.mod }}.jar
            release/overbreak-launcher-${{ steps.vars.outputs.mod }}.jar
            release/update.json
          body: |
            ## OVERBREAK ${{ steps.vars.outputs.mod }}

            마인크래프트 ${{ steps.vars.outputs.mc }} · Fabric ${{ steps.vars.outputs.loader }} · Fabric API ${{ steps.vars.outputs.api }}

            ### 처음 하는 사람
            `overbreak-launcher-${{ steps.vars.outputs.mod }}.jar` 을 받아 두 번 누르면 끝입니다.
            Fabric 모드로더 · Fabric API · OVERBREAK 를 알아서 깔고, 다음부터는 켤 때마다 최신으로 맞춰 줍니다.

            ### 이미 런처가 있는 사람
            런처를 켜고 **업데이트 확인 · 설치** 만 누르면 됩니다. 런처를 다시 받을 필요는 없습니다.

            ### 손으로 넣고 싶다면
            `overbreak-${{ steps.vars.outputs.mod }}.jar` 을 `mods` 폴더에 넣고 옛 판은 지우세요.
